<!DOCTYPE html>
<html lang="ko">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <img src="../Icon.png" width="80" height="80" alt="">
    <h1>Auto PiP</h1>
    <p class="tagline">탭을 옮겨도, 영상은 그대로.</p>
    <p class="state-unknown">Safari에서 확장 프로그램을 켜 주세요.</p>
    <p class="state-on">확장 프로그램이 켜져 있어요.</p>
    <p class="state-off">Safari에서 확장 프로그램을 켜 주세요.</p>
    <ol>
      <li>Safari 설정 → 고급 → <strong>웹 개발자용 기능 보기</strong>를 켜세요.</li>
      <li>개발자 → <strong>서명되지 않은 확장 프로그램 허용</strong>을 켜세요.</li>
      <li>확장 프로그램 → <strong>Auto PiP</strong>를 켜고 웹사이트 접근을 허용하세요.</li>
    </ol>
    <button class="open-preferences">Safari 설정 열기</button>
    <p class="note">영상을 재생한 뒤 다른 탭으로 이동해 보세요.<br>이 로컬 개발 빌드는 Safari를 다시 실행할 때 서명 허용 설정이 필요합니다.</p>
    <p id="error" role="status"></p>
</body>
</html>
